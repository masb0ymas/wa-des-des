[package]
name = "wa-des-des"
version = "0.1.0"
description = "WhatsApp Web desktop client"
authors = ["wa-des-des contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "wa_des_des_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = ["tray-icon", "image-png", "unstable", "macos-private-api"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-notification = "2.5.1"
tauri-plugin-opener = "2.7.0"
tauri-plugin-single-instance = "2.5.2"
tauri-plugin-window-state = "2.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Already in the tree through tauri-plugin-notification; named here only for `pin_dev_identity`.
[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6.15"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
