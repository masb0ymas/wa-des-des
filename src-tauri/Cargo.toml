[package]
name = "WaDesk"
version = "0.1.3"
description = "WhatsApp Web desktop client"
authors = ["WaDesk contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "wa_des_des_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = ["tray-icon", "image-png", "unstable", "macos-private-api"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-notification = "2.5.1"
tauri-plugin-opener = "2.7.0"
tauri-plugin-single-instance = "2.5.2"
tauri-plugin-window-state = "2.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Crash/error reporting. The `transport` feature pulls in reqwest with native-tls, so no TLS
# backend needs to be named here; `debug-images` is off because the release profile strips symbols,
# which would leave that integration with nothing to resolve.
sentry = { version = "0.49.3", default-features = false, features = [
    "backtrace",
    "contexts",
    "panic",
    "transport",
] }
tauri-plugin-updater = "2.12.0"

# Already in the tree through tauri-plugin-notification; named here only for `pin_dev_identity`.
[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6.15"
# Direct UNUserNotificationCenter access for `src/notify.rs`. The plugin's macOS chain
# (notify-rust → mac-notification-sys) speaks the deprecated NSUserNotification API, which the
# system suppresses while the app is frontmost and which never asks for authorization.
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", features = ["NSBundle", "NSString", "NSError"] }
objc2-user-notifications = { version = "0.3.2", features = [
    "UNUserNotificationCenter",
    "UNNotification",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationSettings",
    "UNNotificationTrigger",
] }
block2 = "0.6.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
